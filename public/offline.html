<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAMS AP Booking (offline)</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5EFE3; color: #1A1F2B; font-family: system-ui, sans-serif; padding: 16px; }
  .card { max-width: 380px; background: #fff; border: 1px solid #E4D9C4; border-radius: 20px; padding: 28px; text-align: center; }
  .mark { display: block; width: 56px; height: 56px; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #1D3A7A; }
  p { color: #4C5160; font-size: 14px; line-height: 1.5; }
  button { margin-top: 12px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #1D3A7A; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/brand/tams-icon.svg" alt="" />
    <h1>You are offline</h1>
    <p>This page has not been saved for offline use yet. Open the prototype once while online, then it works without a connection.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
