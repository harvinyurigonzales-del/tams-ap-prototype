<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D3A7A" />
    <meta name="description" content="TAMS AP Booking Management System prototype with fictional sample data" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>TAMS AP Booking (Prototype)</title>
  </head>
  <body>
    <!-- Shown until the app starts, so a slow first load is never a blank page. React replaces it. -->
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#4c5160;background:#f5efe3;text-align:center;padding:16px">
        <div>
          <img src="/brand/tams-icon.svg" alt="" width="56" height="56" style="display:block;margin:0 auto 12px" />
          <p style="margin:0">Loading TAMS AP…</p>
          <p id="boot-slow" style="display:none;margin-top:12px">This is taking longer than usual. <a href="" style="color:#1d3a7a;font-weight:600">Reload</a></p>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var slow = document.getElementById('boot-slow')
        if (slow) slow.style.display = 'block'
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
