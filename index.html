<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B3CC4" />
    <meta name="description" content="TAMS AP Booking Management System prototype with fictional sample data" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>TAMS AP Booking (Prototype)</title>
  </head>
  <body>
    <!-- Shown until the app starts, so a slow first load is never a blank page. React replaces it. -->
    <div id="root">
      <div id="boot" style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#5b5670;background:#f7f6fb;text-align:center;padding:16px">
        <div>
          <div style="width:48px;height:48px;border-radius:12px;background:#5b3cc4;color:#fff;font-weight:700;display:grid;place-items:center;margin:0 auto 12px">TA</div>
          <p style="margin:0">Loading the TAMS AP prototype…</p>
          <p id="boot-slow" style="display:none;margin-top:12px">This is taking longer than usual. <a href="" style="color:#4a2fa3;font-weight:600">Reload</a></p>
        </div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var slow = document.getElementById('boot-slow')
        if (slow) slow.style.display = 'block'
      }, 6000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
